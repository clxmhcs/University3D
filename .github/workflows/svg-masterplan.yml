name: SVG Masterplan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CampusData/svg/**'
      - 'CampusData/transport/external_roads.json'
      - 'CampusData/landscape/perimeter_wall.json'
      - 'Tools/svg_coordinates.py'
      - 'Tools/generate_svg_skeleton.py'
      - 'Tools/generate_svg_step4.py'
      - 'Tools/generate_svg_step5.py'
      - 'Tools/generate_svg_step6.py'
      - 'Tools/generate_svg_step7.py'
      - 'Tools/run_svg_step7.py'
      - 'Tools/normalize_svg_step7_layers.py'
      - 'Tools/release_svg_step8.py'
      - 'Tools/validate_svg_*.py'
      - '.github/workflows/svg-masterplan.yml'

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source snapshot
        run: |
          python Tools/validate_svg_masterplan.py
          python Tools/validate_svg_coordinate_system.py
      - name: Generate Step 4 SVGs
        run: python Tools/generate_svg_step4.py
      - name: Validate Step 4 SVGs
        run: python Tools/validate_svg_step4.py
      - name: Generate Step 5 SVGs
        run: python Tools/generate_svg_step5.py
      - name: Validate Step 5 SVGs
        run: python Tools/validate_svg_step5.py
      - name: Generate Step 6 SVGs
        run: python Tools/generate_svg_step6.py
      - name: Validate Step 6 SVGs
        run: python Tools/validate_svg_step6.py
      - name: Generate Step 7 SVGs
        run: |
          python Tools/run_svg_step7.py
          python Tools/normalize_svg_step7_layers.py
      - name: Validate Step 7 SVGs
        run: python Tools/validate_svg_step7.py
      - name: Generate Step 8 canonical release
        run: python Tools/release_svg_step8.py
      - name: Prove deterministic Step 8 regeneration
        run: |
          sha256sum \
            Artifacts/SVG/Jiangcheng-University-MasterPlan-Engineering.svg \
            Artifacts/SVG/Jiangcheng-University-MasterPlan-Presentation.svg \
            Artifacts/SVG/Jiangcheng-University-MasterPlan-Release-R6.json \
            Artifacts/SVG/Jiangcheng-University-MasterPlan-Release-R6-SHA256.txt > /tmp/step8-first.sha256
          python Tools/release_svg_step8.py
          sha256sum \
            Artifacts/SVG/Jiangcheng-University-MasterPlan-Engineering.svg \
            Artifacts/SVG/Jiangcheng-University-MasterPlan-Presentation.svg \
            Artifacts/SVG/Jiangcheng-University-MasterPlan-Release-R6.json \
            Artifacts/SVG/Jiangcheng-University-MasterPlan-Release-R6-SHA256.txt > /tmp/step8-second.sha256
          diff -u /tmp/step8-first.sha256 /tmp/step8-second.sha256
          echo 'STEP8_DETERMINISTIC_REGENERATION=PASS'
      - name: Validate Step 8 release
        run: python Tools/validate_svg_step8.py
      - name: Commit generated SVGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Step4-R6-Engineering.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Step4-R6-Figma.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Step5-R6-Engineering.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Step5-R6-Figma.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Step6-R6-Engineering.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Step6-R6-Figma.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Step7-R6-Engineering.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Step7-R6-Figma.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Engineering.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Presentation.svg
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Release-R6.json
          git add Artifacts/SVG/Jiangcheng-University-MasterPlan-Release-R6-SHA256.txt
          if git diff --cached --quiet; then
            echo 'SVG artifacts already current.'
          else
            git commit -m 'Generate final R6 SVG masterplan release artifacts'
            git push
          fi
